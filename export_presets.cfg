[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
# The playable game reads these files with FileAccess, not Godot's resource loader.
# Without include_filter the exported Morrow Coast and vehicle catalog are missing.
include_filter="*.json,*.txt"
exclude_filter=""
export_path="dist/Streetbound.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.dbattaglia0823.streetbound"
application/signature="STRB"
application/app_category="Games"
application/short_version="0.1"
application/version="0.1.0"
display/high_res=true
# Built-in ad-hoc signing supports development/CI without Apple credentials.
# Distribution to the public still requires a Developer ID and notarization.
codesign/codesign=1
codesign/entitlements/app_sandbox/enabled=false
notarization/notarization=0
