name: Streetbound Godot regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  physics-and-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.4.1 editor
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Import scripts and artwork
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Test driving forces, brakes, drift, resets and collisions
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/driving_test.gd -- output=test_results_ci.json
      - name: Verify racing handling and steering tuning
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/racing_tune_test.gd
      - name: Verify HUD, camera, input, sound and playable scene
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/runtime_test.gd
      - name: Verify camera speed feedback and bounded visual effects
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/speed_feedback_test.gd
      - name: Verify comfort camera damping, dead zone and turn-rate bounds
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/camera_comfort_test.gd
      - name: Verify world ground detail, beach, water and stream-safe foliage
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/terrain_detail_test.gd
      - name: Verify four-wheel overlay, front steering and reset behavior
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/wheel_visual_test.gd
      - name: Verify compact, sedan, SUV and pickup wheel profiles and resizing
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/multi_model_wheels_test.gd
      - name: Verify preserved Atlas Coast map and intersections
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/world_archive_smoke.gd
      - name: Verify toolkit pause, settings, Quit, Resume and Escape
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/pause_menu_test.gd
      - name: Verify MPH speedometer and all imperial display conversions
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/imperial_display_test.gd

      - name: Verify F1 tuning save, restart, exit flush and restore defaults
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/tuning_persistence_test.gd
      - name: Verify streamed Morrow Coast geometry, atlas and collision clearance
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/open_world_test.gd
      - name: Drive the real vehicle from the starting garage to the coast
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/open_world_drive.gd
      - name: Verify detailed atlas navigation and local minimap caching
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/map_detail_test.gd
      - name: Drive linked mountain switchbacks to Pinecrest
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/mountain_drive.gd
      - name: Verify junction coverage, stop priority and lane-paint clipping
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/junction_test.gd
