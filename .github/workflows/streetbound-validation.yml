name: Streetbound Godot regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The Windows player in the reported logs uses Godot 4.6.3, not the
  # project's older pinned 4.4.1 CI binary. Validate the exact player release.
  godot-463-game-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 matching the reported Windows logs
        run: |
          curl -fL --retry 3 --retry-all-errors -o godot463.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot463.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
      - name: Cold-import clean game resources and verify typed script compilation
        run: |
          set -o pipefail
          test ! -d .godot
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot463-import.log
          # Direct-load individual race scripts when a top-level preload fails.
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/racing_script_probe.gd 2>&1 | tee /tmp/godot463-race-load-probe.log || true
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/godot463-import.log; then
            echo "Godot 4.6.3 import reported unresolved script classes" >&2
            exit 1
          fi
      - name: Start real Morrow Coast with ownership, wheel rig, HUD and camera
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/game_startup_smoke_test.gd 2>&1 | tee /tmp/godot463-startup.log
          grep -q 'REAL GAME STARTUP: PASS' /tmp/godot463-startup.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Invalid assignment of property' /tmp/godot463-startup.log; then
            echo "Game failed to fully initialize in Godot 4.6.3" >&2
            exit 1
          fi
      - name: Launch the normal game scene, not only the test harness
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 35s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --quit-after 90 2>&1 | tee /tmp/godot463-real-game.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Invalid assignment of property|Parse Error:' /tmp/godot463-real-game.log; then
            echo "Normal game startup logged a script failure" >&2
            exit 1
          fi
      - name: Verify head-to-head street racing around real moving traffic
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/racing_traffic_overtaking_test.gd 2>&1 | tee /tmp/godot463-racing-traffic.log
          grep -q 'RACING TRAFFIC OVERTAKING: PASS' /tmp/godot463-racing-traffic.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/godot463-racing-traffic.log
      - name: Verify traffic graph racing line on city streets and circuit
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/traffic_racing_line_test.gd 2>&1 | tee /tmp/godot463-racing-line.log
          grep -q 'TRAFFIC-AWARE RACING LINE: PASS' /tmp/godot463-racing-line.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/godot463-racing-line.log
      - name: Check active minimap route and real-speed braking line at Ashford
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/race_guidance_test.gd 2>&1 | tee /tmp/godot463-race-guidance.log
          grep -q 'RACE ROUTE AND BRAKING GUIDE: PASS' /tmp/godot463-race-guidance.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/godot463-race-guidance.log
      - name: Verify head-to-head Ashford AI obeys player physics and race progression
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/race_ai_test.gd 2>&1 | tee /tmp/godot463-racing-ai.log
          grep -q 'ASHFORD HEAD TO HEAD AI: PASS' /tmp/godot463-racing-ai.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/godot463-racing-ai.log
      - name: Verify slimmer and inset wheels across model changes (Godot 4.6.3)
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/wheel_visual_test.gd 2>&1 | tee /tmp/godot463-wheel-visual.log
          grep -q 'WHEEL VISUAL TESTS: PASS' /tmp/godot463-wheel-visual.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/godot463-wheel-visual.log
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/multi_model_wheels_test.gd 2>&1 | tee /tmp/godot463-multi-wheel.log
          grep -q 'MULTI-MODEL WHEEL TESTS: PASS' /tmp/godot463-multi-wheel.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/godot463-multi-wheel.log
      - name: Verify tire contact positions and curb animation (Godot 4.6.3)
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/curb_suspension_animation_test.gd 2>&1 | tee /tmp/godot463-curb.log
          grep -q 'CURB SUSPENSION ANIMATIONS: PASS' /tmp/godot463-curb.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/godot463-curb.log
      - name: Verify 10 percent larger traffic and 20 percent world camera zoom (Godot 4.6.3)
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/camera_comfort_test.gd 2>&1 | tee /tmp/godot463-zoom.log
          grep -q 'CAMERA COMFORT TESTS: PASS' /tmp/godot463-zoom.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/godot463-zoom.log
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/traffic_safety_test.gd 2>&1 | tee /tmp/godot463-traffic-size.log
          grep -q 'TRAFFIC SAFETY / CRASH PHYSICS: PASS' /tmp/godot463-traffic-size.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/godot463-traffic-size.log
      - name: Validate compact dashboard, vertical meters, zero text overlap and telemetry on Godot 4.6.3
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/live_vehicle_dashboard_test.gd 2>&1 | tee /tmp/streetbound-dashboard-layout.log
          grep -q 'LIVE DRIVING DASHBOARD: PASS' /tmp/streetbound-dashboard-layout.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|FAIL ' /tmp/streetbound-dashboard-layout.log; then
            echo "Dashboard rendered incorrectly or lost telemetry in Godot 4.6.3" >&2
            exit 1
          fi
  physics-and-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.4.1 editor
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Use Node 22 for the repo-owned map builder
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test map health, safe snaps, recovery and road priority
        run: node --test map-editor/tests/*.test.mjs
      - name: Validate Morrow Coast editable source overlays and road endpoint safety
        run: python3 tests/morrow_editor_bridge_test.py
      - name: Test local project file access, source revision checks and safe rebuild rollback
        run: python3 tests/map_editor_server_test.py
      - name: Verify actual Morrow Coast editor no-edit round trip preserves the playable source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {convertMorrowWorld,morrowEditText} from './map-editor/morrow-coast-bridge.js';
          const map=JSON.parse(fs.readFileSync('worlds/morrow-coast.world.json','utf8'));
          fs.writeFileSync('/tmp/morrow-edit-roundtrip.json',morrowEditText(convertMorrowWorld(map).doc));
          JS
          python3 tests/morrow_roundtrip_validate.py /tmp/morrow-edit-roundtrip.json
      - name: Rebuild complete Morrow Coast for geometry, surface and collision regression
        run: python3 tools/build_morrow_coast.py
      - name: Prove edit-existing-scenery and Apply to Game rebuild the playable world safely
        run: python3 tests/map_editor_live_apply_test.py
      - name: Ensure two consecutive map expansions leave every existing object and landmark in place
        run: python3 tests/morrow_expansion_stability_test.py
      - name: Import scripts and artwork
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Guard actual game startup against a green screen, broken HUD, or missing camera
        run: |
          set -o pipefail
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/game_startup_smoke_test.gd 2>&1 | tee /tmp/streetbound-startup.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Invalid assignment of property' /tmp/streetbound-startup.log; then
            echo "Godot reported a startup script error despite the test result" >&2
            exit 1
          fi
      - name: Test driving forces, brakes, drift, resets and collisions
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/driving_test.gd -- output=test_results_ci.json
      - name: Verify racing handling and steering tuning
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/racing_tune_test.gd
      - name: Verify all 154 future car audio profiles, five new engine layouts, hybrid, rotary and true EV sounds
        run: timeout --signal=SIGINT --kill-after=5s 145s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/pending_vehicle_audio_test.gd
      - name: Verify ten rights-documented recorded engine beds, seam quality, loaded cars and mute
        run: timeout --signal=SIGINT --kill-after=5s 125s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/recorded_engine_beds_test.gd
      - name: Verify 88 individually mastered cars, load/coast RPM loops, environment, limiter, curb and downshift audio
        run: timeout --signal=SIGINT --kill-after=5s 110s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/fleet_audio_mastering_test.gd
      - name: Verify 88 engine audio profiles, loop blending, turbo spool, blowoff, flutter and tuned exhaust
        run: timeout --signal=SIGINT --kill-after=5s 100s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/engine_turbo_audio_test.gd
      - name: Verify HUD, camera, input, sound and playable scene
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/runtime_test.gd
      - name: Verify camera speed feedback and bounded visual effects
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/speed_feedback_test.gd
      - name: Verify comfort camera damping, dead zone and turn-rate bounds
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/camera_comfort_test.gd
      - name: Verify optimized chunk activation, road detail and imported texture budgets
        run: timeout --signal=SIGINT --kill-after=5s 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/map_stream_quality_test.gd
      - name: Validate safe Morrow editor scenery baking
        run: python3 tests/morrow_environment_props_test.py
      - name: Verify roadside furniture, POI facades and parking/ground detail
        run: timeout --signal=SIGINT --kill-after=5s 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/morrow_environment_visual_test.gd
      - name: Verify deterministic road patches, crack stationing and faded lane paint
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/morrow_road_wear_test.gd
      - name: Validate parking lot layer order and ten dealership painted/drivable entrances
        run: timeout --signal=SIGINT --kill-after=5s 80s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/map_pavement_alignment_test.gd
      - name: Verify actual asphalt parking, illustrated shrubbery and parked traffic car art
        run: timeout --signal=SIGINT --kill-after=5s 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/parking_ground_visual_test.gd
      - name: Verify world ground detail, beach, water and stream-safe foliage
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/terrain_detail_test.gd
      - name: Verify four-wheel overlay, front steering and reset behavior
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/wheel_visual_test.gd
      - name: Verify compact, sedan, SUV and pickup wheel profiles and resizing
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/multi_model_wheels_test.gd
      - name: Verify both urban sidewalks, curved junction corners and coast boardwalk
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/urban_walkways_boardwalk_test.gd
      - name: Verify real curb-entry suspension, individual wheel lift, shadow and collision independence
        run: timeout --signal=SIGINT --kill-after=5s 110s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/curb_suspension_animation_test.gd
      - name: Verify joined tire marks on asphalt and grass
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/continuous_tire_marks_test.gd
      - name: Verify distinctive Morrow landmarks and surface-reactive visual effects
        run: timeout --signal=SIGINT --kill-after=5s 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/morrow_destination_surface_test.gd
      - name: Verify invisible road/sidewalk outlines and geometry APIs
        run: timeout --signal=SIGINT --kill-after=5s 55s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/map_geometry_tools_test.gd
      - name: Verify standalone map-builder Godot loader follows road priority
        run: timeout --signal=SIGINT --kill-after=5s 45s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/map_editor_adapter_test.gd
      - name: Verify Morrow Coast right-hand traffic graph, legal turns and spawn cap
        run: timeout --signal=SIGINT --kill-after=5s 55s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/morrow_traffic_test.gd
      - name: Verify imported traffic artwork, physical collisions and post-impact route recovery
        run: timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/traffic_impact_recovery_test.gd
      - name: Verify four-way intersection queue restarts and smooth turn geometry
        run: timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/traffic_intersection_flow_test.gd
      - name: Verify forward traffic sensing, crossing priority and crash geometry
        run: timeout --signal=SIGINT --kill-after=5s 75s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/traffic_safety_test.gd
      - name: Verify race-earned upgrade inventory, car slots, grip/drift stats, garage UI and save migration
        run: timeout --signal=SIGINT --kill-after=5s 125s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/garage_upgrades_test.gd
      - name: Verify Ashford quarter-mile racing XP, player and car level caps, rarity gates and purchase locks
        run: timeout --signal=SIGINT --kill-after=5s 125s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/race_progression_test.gd
      - name: Verify dealership locations, building art, stock, purchases and owned garage collection
        run: timeout --signal=SIGINT --kill-after=5s 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/dealership_system_test.gd
      - name: Verify drive-in Laurel garage, parked-only selection and physical bay collision
        run: timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/drive_in_garage_test.gd
      - name: Verify 88 playable vehicles, selected dimensions, wheel rig and garage grid
        run: timeout --signal=SIGINT --kill-after=5s 110s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/player_vehicle_roster_test.gd
      - name: Audit 88 vehicle alpha silhouettes, wheel positions and artwork transparency
        run: timeout --signal=SIGINT --kill-after=5s 110s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/vehicle_art_geometry_audit_test.gd
      - name: Verify fast automatic gear shifts and immediate safe reverse/Drive transition
        run: timeout --signal=SIGINT --kill-after=5s 45s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/automatic_shift_response_test.gd
      - name: Verify preserved Atlas Coast map and intersections
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/world_archive_smoke.gd
      - name: Verify toolkit pause, settings, Quit, Resume and Escape
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/pause_menu_test.gd
      - name: Verify live speed/RPM gauges, real turbo boost, NA fallback, race stats and responsive dash
        run: timeout --signal=SIGINT --kill-after=5s 110s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/live_vehicle_dashboard_test.gd
      - name: Verify MPH speedometer and all imperial display conversions
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/imperial_display_test.gd

      - name: Verify F1 tuning save, restart, exit flush and restore defaults
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/tuning_persistence_test.gd
      - name: Verify streamed Morrow Coast geometry, atlas and collision clearance
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/open_world_test.gd
      - name: Drive the real vehicle from the starting garage to the coast
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/open_world_drive.gd
      - name: Verify detailed atlas navigation and local minimap caching
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/map_detail_test.gd
      - name: Drive linked mountain switchbacks to Pinecrest
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/mountain_drive.gd
      - name: Verify junction coverage, stop priority and lane-paint clipping
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/junction_test.gd
