name: Prepare verified CC0 recorded engine beds
on:
  push:
    branches:
      - feature/licensed-field-engine-textures
    paths:
      - tools/prepare_cc0_engine_beds.py
      - .github/workflows/import-verified-cc0-engine-beds.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-engine-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/feature/licensed-field-engine-textures'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install deterministic audio processing tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -n 1
      - name: Fetch hash-pinned CC0 field samples and create click-reduced OGG loops
        run: python3 tools/prepare_cc0_engine_beds.py
      - name: Verify no unlicensed or unexpected source names were imported
        run: |
          python3 - <<'PY'
          import json, pathlib
          folder = pathlib.Path('assets/audio/engines')
          data = json.loads((folder/'RECORDING_MANIFEST.json').read_text())
          rows = data['recordings']
          assert len(rows) == 10
          assert all(r['license']=='CC0-1.0' for r in rows)
          assert all(pathlib.Path(r['output']).stat().st_size >= 800 for r in rows)
          assert len({r['family'] for r in rows}) == 10
          print('Verified 10 CC0-origin acoustic-family recordings.')
          PY
      - name: Save listening A/B reference preview (not shipped with game)
        uses: actions/upload-artifact@v4
        with:
          name: streetbound-cc0-engine-audition
          path: |
            engine_audition.wav
            assets/audio/engines/RECORDING_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit processed engine recordings to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/engines/
          if git diff --cached --quiet; then
            echo "All recorded assets already committed."
          else
            git commit -m "Import ten verified CC0 recorded engine layers with acoustic QA manifest"
            # Other commits may land while ffmpeg is downloading; rebase
            # the data-only commit without overwriting someone else's work.
            git fetch origin feature/licensed-field-engine-textures
            git rebase FETCH_HEAD
            git push origin HEAD:feature/licensed-field-engine-textures
          fi
