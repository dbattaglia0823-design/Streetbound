name: Streetbound low-latency multiplayer

on:
  pull_request:
    paths:
      - "scripts/network/**"
      - "scripts/main.gd"
      - "scripts/world/world_publication.gd"
      - "tests/online_map_race_rules_test.gd"
      - "tests/online_map_race_rules_test.gd.uid"
      - "tests/online_published_world_probe.gd"
      - "tests/online_published_world_probe.gd.uid"
      - "scripts/vehicle/vehicle_ownership.gd"
      - "tests/online_friend_rewards_test.gd"
      - "tests/online_friend_rewards_test.gd.uid"
      - "tests/online_friend_rewards_world_probe.gd"
      - "tests/online_friend_rewards_world_probe.gd.uid"
      - "tests/online_friend_standings_test.gd"
      - "tests/online_friend_standings_test.gd.uid"
      - "tests/online_network_smoothing_test.gd"
      - "tests/online_network_smoothing_test.gd.uid"
      - "tests/online_realtime_world_probe.gd"
      - "tests/online_realtime_world_probe.gd.uid"
      - "tests/online_friend_connection_probe.gd"
      - "tests/online_reconnect_world_probe.gd"
      - "tests/online_reconnect_world_probe.gd.uid"
      - "tests/online_reconnect_impairment_test.gd"
      - "tests/online_reconnect_impairment_test.gd.uid"
      - "tests/online_friend_drag_rules_test.gd"
      - "tests/online_friend_drag_rules_test.gd.uid"
      - "tests/online_friend_drag_world_probe.gd"
      - "tests/online_friend_drag_world_probe.gd.uid"
      - "tests/online_friend_circuit_rules_test.gd"
      - "tests/online_friend_circuit_rules_test.gd.uid"
      - "tests/online_friend_circuit_world_probe.gd"
      - "tests/online_friend_circuit_world_probe.gd.uid"
      - "tests/online_friend_street_rules_test.gd"
      - "tests/online_friend_street_rules_test.gd.uid"
      - "tests/online_friend_street_world_probe.gd"
      - "tests/online_friend_street_world_probe.gd.uid"
      - ".github/workflows/multiplayer-latency-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  realtime-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable resource UIDs
        run: python3 tests/resource_uid_test.py
      - name: Cache pinned Godot executable
        uses: actions/cache@v4
        with:
          path: Godot_v4.6.3-stable_linux.x86_64
          key: godot-linux-4.6.3-${{ runner.arch }}-v1
      - name: Install tested Godot 4.6.3
        run: |
          if test -x ./Godot_v4.6.3-stable_linux.x86_64; then exit 0; fi
          curl -fL --retry 3 --retry-all-errors -o godot463.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot463.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
      - name: Cold-import game and compile GDScript
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/multi-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' /tmp/multi-import.log
      - name: Deterministic interpolator and prediction regression
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_network_smoothing_test.gd 2>&1 | tee /tmp/multi-smoothing.log
          grep -q 'NETWORK SMOOTHING: PASS' /tmp/multi-smoothing.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/multi-smoothing.log
      - name: Synthetic 30/80/150 ms RTT jitter and packet-loss bounds
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_reconnect_impairment_test.gd 2>&1 | tee /tmp/reconnect-impairment.log
          grep -q 'RECONNECT IMPAIRMENT PROFILE: PASS' /tmp/reconnect-impairment.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/reconnect-impairment.log
      - name: Host-authoritative friend drag lane, finish and ranking rules
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_drag_rules_test.gd 2>&1 | tee /tmp/friend-drag-rules.log
          grep -q 'FRIEND DRAG RULES: PASS' /tmp/friend-drag-rules.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-drag-rules.log
      - name: Circuit anti-shortcut forward gate and track-safe grid regression
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_circuit_rules_test.gd 2>&1 | tee /tmp/friend-circuit-rules.log
          grep -q 'FRIEND CIRCUIT RULES: PASS' /tmp/friend-circuit-rules.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-circuit-rules.log
      - name: Street sprint ordered checkpoints and narrow-grid regression
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_street_rules_test.gd 2>&1 | tee /tmp/friend-street-rules.log
          grep -q 'FRIEND STREET RULES: PASS' /tmp/friend-street-rules.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-street-rules.log
      - name: Validated session-only friend league and replay prevention
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_standings_test.gd 2>&1 | tee /tmp/friend-standings.log
          grep -q 'FRIEND SESSION STANDINGS: PASS' /tmp/friend-standings.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-standings.log
      - name: Matching published worlds and map-authored checkpoint/grid rules
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_map_race_rules_test.gd 2>&1 | tee /tmp/map-race-rules.log
          grep -q 'MAP-INDEPENDENT FRIEND RACING: PASS' /tmp/map-race-rules.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/map-race-rules.log
      - name: Persistent friend race cash XP item rolls and replay-safe career saves
        run: |
          set -o pipefail
          timeout --signal=SIGINT --kill-after=5s 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_rewards_test.gd 2>&1 | tee /tmp/friend-career-rewards.log
          grep -q 'FRIEND CAREER REWARDS: PASS' /tmp/friend-career-rewards.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-career-rewards.log
      - name: Actual invite-protected ENet exchange with measured RTT
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 55s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_connection_probe.gd -- host >/tmp/online-enet-host.log 2>&1 &
          host_pid=$!
          sleep 1
          timeout --signal=SIGINT --kill-after=5s 55s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_connection_probe.gd -- guest >/tmp/online-enet-guest.log 2>&1 &
          guest_pid=$!
          sleep 0.3
          timeout --signal=SIGINT --kill-after=5s 55s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_connection_probe.gd -- intruder >/tmp/online-enet-intruder.log 2>&1 &
          intruder_pid=$!
          guest_code=0
          host_code=0
          intruder_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$intruder_pid" || intruder_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/online-enet-host.log /tmp/online-enet-guest.log /tmp/online-enet-intruder.log
          test "$guest_code" -eq 0
          test "$intruder_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'ONLINE TWO PROCESS HOST: PASS' /tmp/online-enet-host.log
          grep -q 'ONLINE TWO PROCESS GUEST: PASS' /tmp/online-enet-guest.log
          grep -q 'ONLINE TWO PROCESS INTRUDER: PASS' /tmp/online-enet-intruder.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/online-enet-host.log /tmp/online-enet-guest.log /tmp/online-enet-intruder.log
      - name: Full game host/guest snapshots and live RTT over localhost
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 120s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_realtime_world_probe.gd -- host >/tmp/realtime-host.log 2>&1 &
          host_pid=$!
          sleep 2
          timeout --signal=SIGINT --kill-after=5s 120s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_realtime_world_probe.gd -- guest >/tmp/realtime-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/realtime-host.log /tmp/realtime-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'LOW LATENCY WORLD HOST: PASS' /tmp/realtime-host.log
          grep -q 'LOW LATENCY WORLD GUEST: PASS' /tmp/realtime-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/realtime-host.log /tmp/realtime-guest.log

      - name: Two full gameplay clients recover the original locked-lobby car after an ENet interruption
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_reconnect_world_probe.gd -- host >/tmp/reconnect-host.log 2>&1 &
          host_pid=$!
          sleep 2
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_reconnect_world_probe.gd -- guest >/tmp/reconnect-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/reconnect-host.log /tmp/reconnect-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'RECONNECT REAL WORLD HOST: PASS' /tmp/reconnect-host.log
          grep -q 'RECONNECT REAL WORLD GUEST: PASS' /tmp/reconnect-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/reconnect-host.log /tmp/reconnect-guest.log

      - name: Repeat real Ashford friend drag countdown and host-only results twice
        run: |
          set -euo pipefail
          for attempt in 1 2; do
              echo "FRIEND RACE INTEGRATION ATTEMPT $attempt"
            timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_drag_world_probe.gd -- host >/tmp/friend-drag-host.log 2>&1 &
            host_pid=$!
            sleep 2
            timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_drag_world_probe.gd -- guest >/tmp/friend-drag-guest.log 2>&1 &
            guest_pid=$!
            guest_code=0
            host_code=0
            wait "$guest_pid" || guest_code=$?
            wait "$host_pid" || host_code=$?
            cat /tmp/friend-drag-host.log /tmp/friend-drag-guest.log
            test "$guest_code" -eq 0
            test "$host_code" -eq 0
            grep -q 'FRIEND DRAG WORLD HOST: PASS' /tmp/friend-drag-host.log
            grep -q 'FRIEND DRAG WORLD GUEST: PASS' /tmp/friend-drag-guest.log
            ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-drag-host.log /tmp/friend-drag-guest.log
          done

      - name: Real two-process Ashford circuit host-selected event and validated DNF
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_circuit_world_probe.gd -- host >/tmp/friend-circuit-host.log 2>&1 &
          host_pid=$!
          sleep 2
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_circuit_world_probe.gd -- guest >/tmp/friend-circuit-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/friend-circuit-host.log /tmp/friend-circuit-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'FRIEND CIRCUIT WORLD HOST: PASS' /tmp/friend-circuit-host.log
          grep -q 'FRIEND CIRCUIT WORLD GUEST: PASS' /tmp/friend-circuit-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-circuit-host.log /tmp/friend-circuit-guest.log

      - name: Real two-process Larkspur street race with DNF and no solo rewards
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_street_world_probe.gd -- host >/tmp/friend-street-host.log 2>&1 &
          host_pid=$!
          sleep 2
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_street_world_probe.gd -- guest >/tmp/friend-street-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/friend-street-host.log /tmp/friend-street-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'FRIEND STREET WORLD HOST: PASS' /tmp/friend-street-host.log
          grep -q 'FRIEND STREET WORLD GUEST: PASS' /tmp/friend-street-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/friend-street-host.log /tmp/friend-street-guest.log

      - name: Build production Map Builder fixture for network race validation
        run: python3 tests/published_world_runtime_fixture.py
      - name: Two-process published Map Builder world and friend sprint with validated results
        run: |
          set -euo pipefail
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_published_world_probe.gd -- host >/tmp/published-host.log 2>&1 &
          host_pid=$!
          sleep 2
          timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_published_world_probe.gd -- guest >/tmp/published-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/published-host.log /tmp/published-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'PUBLISHED ONLINE WORLD HOST: PASS' /tmp/published-host.log
          grep -q 'PUBLISHED ONLINE WORLD GUEST: PASS' /tmp/published-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/published-host.log /tmp/published-guest.log

      - name: Separate host and guest career saves for end-to-end rewards
        run: |
          set -euo pipefail
          mkdir -p /tmp/sb-prize-host /tmp/sb-prize-guest
          XDG_DATA_HOME=/tmp/sb-prize-host timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_rewards_world_probe.gd -- host >/tmp/prize-host.log 2>&1 &
          host_pid=$!
          sleep 2
          XDG_DATA_HOME=/tmp/sb-prize-guest timeout --signal=SIGINT --kill-after=5s 115s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/online_friend_rewards_world_probe.gd -- guest >/tmp/prize-guest.log 2>&1 &
          guest_pid=$!
          guest_code=0
          host_code=0
          wait "$guest_pid" || guest_code=$?
          wait "$host_pid" || host_code=$?
          cat /tmp/prize-host.log /tmp/prize-guest.log
          test "$guest_code" -eq 0
          test "$host_code" -eq 0
          grep -q 'FRIEND REAL REWARDS WORLD HOST: PASS' /tmp/prize-host.log
          grep -q 'FRIEND REAL REWARDS WORLD GUEST: PASS' /tmp/prize-guest.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|^FAIL ' /tmp/prize-host.log /tmp/prize-guest.log
